<!--
  =============================================================================
  WHAT: Enterprise System Roles Index Layout (Framework-Agnostic HTML)
  WHEN: Deployed in non-Laravel systems (e.g., Node.js, Python, Ruby, or static frontends).
  WHY:  Provides a completely decoupled, semantic user interface structure free of framework dependencies for listing, auditing, modifying, and tearing down security tiers.
  WHO:  Frontend engineers, full-stack architects, and system administrators.
  WHERE: Saved as public/layouts/roles-index.html or integrated into template engines.
  HOW:  Renders responsive tabular data containers, flash notifications, navigation headers, and record management action hooks.
  -----------------------------------------------------------------------------
  FUTURE MODIFICATIONS & CUSTOMIZATION GUIDE:
  - ADDING NEW COLUMNS: Insert a new `<th>` element in the table header and a corresponding `<td>` cell inside the data rows loop.
  - MODIFYING ROUTE BINDINGS: Update the anchor `href` and form `action` attributes to point to your backend routing endpoints.
  =============================================================================
-->

<div>
    <div>

        <!-- Success Flash Notification Display -->
        <div style="display: none;">
            <!-- Flash message container -->
        </div>

        <!-- Role Management Header Section -->
        <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <div>
                <h1 style="margin: 0 0 0.5rem 0; font-size: 1.5rem;">System Roles</h1>
                <p style="margin: 0; color: #6b7280; font-size: 0.875rem;">Manage authorization levels and system access parameters.</p>
            </div>
            <div style="display: flex; gap: 0.75rem;">
                <a href="/roles/create">Create New Role</a>
                <a href="/dashboard">Go To Dashboard</a>
            </div>
        </header>

        <!-- Role Records Tabular Data Container -->
        <div>
            <table style="width: 100%; border-collapse: collapse; text-align: left;">
                <thead>
                    <tr style="border-bottom: 2px solid #e5e7eb;">
                        <th style="padding: 0.75rem;">ID</th>
                        <th style="padding: 0.75rem;">Name</th>
                        <th style="padding: 0.75rem;">Slug</th>
                        <th style="padding: 0.75rem;">Level</th>
                        <th style="padding: 0.75rem;">System Role</th>
                        <th style="padding: 0.75rem; text-align: right;">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr style="border-bottom: 1px solid #e5e7eb;">
                        <td style="padding: 0.75rem;">1</td>
                        <td style="padding: 0.75rem;"><strong>Administrator</strong></td>
                        <td style="padding: 0.75rem;"><code>administrator</code></td>
                        <td style="padding: 0.75rem;"><code>10</code></td>
                        <td style="padding: 0.75rem;">Yes</td>
                        <td style="padding: 0.75rem; text-align: right;">
                            <div style="display: flex; justify-content: flex-end; gap: 0.5rem; align-items: center;">
                                <a href="/roles/show/1">View</a>
                                <a href="/roles/edit/1">Edit</a>
                            </div>
                        </td>
                    </tr>
                    <tr style="border-bottom: 1px solid #e5e7eb;">
                        <td style="padding: 0.75rem;">2</td>
                        <td style="padding: 0.75rem;"><strong>Editor</strong></td>
                        <td style="padding: 0.75rem;"><code>editor</code></td>
                        <td style="padding: 0.75rem;"><code>20</code></td>
                        <td style="padding: 0.75rem;">No</td>
                        <td style="padding: 0.75rem; text-align: right;">
                            <div style="display: flex; justify-content: flex-end; gap: 0.5rem; align-items: center;">
                                <a href="/roles/show/2">View</a>
                                <a href="/roles/edit/2">Edit</a>
                                <form action="/roles/destroy/2" method="POST" style="display:inline;">
                                    <input type="hidden" name="_method" value="DELETE">
                                    <input type="hidden" name="_token" value="sample-csrf-token">
                                    <button type="submit" aria-label="Delete role configuration">
                                        &#128465; Delete
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>
</div>
